<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>页面不存在 · 生产计划与交付管理 MVP</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: #f6f7f9; color: #0f172a;
    }
    .box { max-width: 520px; padding: 32px; text-align: center; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #556; line-height: 1.7; font-size: 14px; margin: 0 0 16px; }
    .btn {
      display: inline-block; padding: 8px 16px; border-radius: 6px;
      background: #0f172a; color: #fff; text-decoration: none; font-size: 14px;
    }
    code { background: #eef1f5; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>这个地址没有页面</h1>
    <p>
      本站是纯静态单页应用，页面切换用地址里的 <code>#/</code> 片段完成，
      服务器上并不存在对应的文件路径。请回到首页后从左侧导航进入。
    </p>
    <a class="btn" href="./" id="home">返回首页</a>
  </div>
  <script>
    // 保留原始 hash 直接回首页：静态站点没有服务端路由，越早纠正越好
    if (location.hash) document.getElementById('home').href = './' + location.hash;
    setTimeout(function () { location.replace('./' + location.hash); }, 1200);
  </script>
</body>
</html>
