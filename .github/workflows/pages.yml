name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，不打断正在进行的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建静态站点
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 启用 Pages（若仓库尚未开启）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包发布目录 app/
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
