name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 校验（语法 + 断言）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 语法门禁
        run: node app/tests/check-syntax.mjs

      - name: 自动化校验（31 项算法 + 50 项导入导出 + 42 项数据集导入 + 52 项 Excel/CSV 批量导入）
        working-directory: app
        run: npm test
